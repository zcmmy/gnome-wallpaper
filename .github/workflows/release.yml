name: Publish plugin release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify version and tools
        run: |
          test "$(cat VERSION)" = "$RELEASE_TAG"
          test -f "docs/releases/$RELEASE_TAG.md"
          command -v gh
          if ! command -v glib-compile-schemas; then
            sudo apt-get update
            sudo apt-get install -y libglib2.0-bin
          fi
      - name: Build and verify plugin assets
        run: |
          python3 integration/scripts/package-release.py
          cd "build/releases/$RELEASE_TAG"
          sha256sum --check SHA256SUMS
      - name: Create draft, upload assets, then publish
        run: |
          # A failed upload leaves a draft. Re-running resumes only that draft.
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/release-state.json"))["isDraft"], "Release already published; refusing to replace assets"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "GNOME Wallpaper $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" "build/releases/$RELEASE_TAG/"* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
