name: Publish plugin release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed version tag (full package release)'
        required: true
      artifact_run:
        description: 'Verified Debian 13 full-package build run containing sources and checksums'
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT_RUN: ${{ inputs.artifact_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: full-extension-release
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
          path: dist/release
      - name: Verify complete release inputs
        run: |
          test "$(cat VERSION)" = "$RELEASE_TAG"
          test -f "docs/releases/$RELEASE_TAG.md"
          test -f dist/release/dependency-corresponding-sources.tar.gz
          test -f dist/release/renderer-corresponding-source.tar.gz
          gh api "repos/$GH_REPO/actions/runs/$ARTIFACT_RUN" > /tmp/build-run.json
          SOURCE_COMMIT=$(git rev-parse HEAD) python3 -c 'import json,os; r=json.load(open("/tmp/build-run.json")); assert r["conclusion"]=="success" and r["head_sha"]==os.environ["SOURCE_COMMIT"] and r["path"]==".github/workflows/build-full-package.yml"'
          export SOURCE_COMMIT=$(git rev-parse HEAD)
          cd dist/release
          sha256sum --check SHA256SUMS
          python3 -c 'import json,os; m=json.load(open("backend-manifest.json")); assert m["version"]==os.environ["RELEASE_TAG"] and m["renderer_build"]["commit"]==os.environ["SOURCE_COMMIT"]'
      - name: Create draft, upload assets, then publish
        run: |
          # A failed upload leaves a draft. Re-running resumes only that draft.
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/release-state.json"))["isDraft"], "Release already published; refusing to replace assets"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "GNOME Wallpaper $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" "dist/release/"* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
